[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchparity"
dynamic = ["version"]
description = "Check that ONNX, OpenVINO, Core ML, TensorRT, ExecuTorch and torch.compile give the same results as eager PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "usmanmateen", email = "74776275+usmanmateen@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy", "tomli>=1.1; python_version < '3.11'"]
keywords = ["pytorch", "onnx", "openvino", "coreml", "tensorrt", "executorch", "testing", "numerics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
onnx = ["onnxscript", "onnx", "onnxruntime"]
openvino = ["openvino"]
coreml = ["coremltools"]
tensorrt = ["torch-tensorrt"]
executorch = ["executorch"]
dev = ["pytest", "ruff"]

[project.scripts]
torchparity = "torchparity.cli:main"

[project.urls]
Repository = "https://github.com/usmanmateen/torchparity"
Results = "https://github.com/usmanmateen/torchparity/blob/main/RESULTS.md"

[tool.hatch.version]
path = "src/torchparity/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

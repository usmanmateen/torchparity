# Re-runs every CPU backend on its latest release each week and opens a pull request
# when RESULTS.md changes. Torch-TensorRT needs a CUDA GPU, so results/tensorrt.json
# is produced locally and committed.
name: Results

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: onnx
            packages: onnxscript onnx onnxruntime
          - backend: openvino
            packages: openvino
          - backend: coreml
            packages: coremltools
          - backend: executorch
            packages: executorch
          - backend: inductor
            packages: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e . ${{ matrix.packages }}
      - name: Run
        run: torchparity run ${{ matrix.backend }} -o results/${{ matrix.backend }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.backend }}
          path: results/${{ matrix.backend }}.json

  report:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: results
          pattern: results-*
          merge-multiple: true
      - name: Report
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e .
          torchparity report results/*.json -o RESULTS.md --readme README.md
      - uses: peter-evans/create-pull-request@v8
        id: pr
        with:
          branch: weekly-results
          commit-message: Update results
          title: Update results
          body: Weekly run of every CPU backend on its latest release.
      # A pull request opened with GITHUB_TOKEN doesn't start other workflows (only workflow_dispatch
      # does), so start CI on the branch to give the pull request the checks main requires.
      - name: Run CI on the pull request
        if: ${{ steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo ${{ github.repository }} --ref weekly-results

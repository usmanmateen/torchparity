name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,onnx]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Smoke run
        run: torchparity run onnx -k add/ -k div/ -k remainder/

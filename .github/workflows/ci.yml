name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Results workflow starts CI this way on the pull requests it opens.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,onnx]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Smoke run
        run: torchparity run onnx -k add/ -k div/ -k remainder/
